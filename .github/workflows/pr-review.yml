name: AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Fetch pull request diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const response = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              headers: { accept: 'application/vnd.github.v3.diff' }
            });
            fs.writeFileSync('pr.diff', response.data);

      - name: Run AI review
        run: app/node_modules/.bin/tsx automation/review-bot.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_DIFF_FILE: pr.diff
          REVIEW_OUTPUT_FILE: review.json

      - name: Post review verdict
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const review = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            const label = review.verdict === 'approve' ? '✅ approve' : '❌ request_changes';
            const comments = review.comments.length
              ? review.comments.map(comment => `- ${comment}`).join('\n')
              : '- No issues found.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `<!-- ai-review-verdict: ${review.verdict} -->\n### AI review: ${label}\n\n${comments}`
            });
