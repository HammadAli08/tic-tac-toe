name: Code Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: app/node_modules/.bin/tsx automation/discovery-agent.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCOVERY_OUTPUT: automation/discovery-report.md
      - name: Commit discovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/discovery-report.md
          git diff --cached --quiet || git commit -m "docs: update discovery report"
          git push
